spring:
  application:
    name: timesmanager
	datasource:
	  url: jdbc:h2:mem:testdb
	  driver-class-name: org.h2.Driver
	  username: sa
	  password:
	h2:
	  console:
	    enabled: true
	jpa:
	  hibernate:
	    ddl-auto: none
	  properties:
	    hibernate:
	      dialect: org.hibernate.dialect.H2Dialect