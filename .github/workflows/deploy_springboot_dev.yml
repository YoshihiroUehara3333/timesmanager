name: Deploy Spring Boot App to EC2_Dev

on:
  push:
    branches:
      - feature
    paths:
      - 'springboot/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build with Gradle
      run: gradle clean build
      working-directory: ./springboot
      
    - name: Copy jar file to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST_DEV }}
        username: ${{ secrets.EC2_USER_DEV }}
        key: ${{ secrets.EC2_KEY_DEV }}
        source: springboot/build/libs/*.jar
        target: /home/ec2-user/app/

    - name: SSH and restart app
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST_DEV }}
        username: ${{ secrets.EC2_USER_DEV }}
        key: ${{ secrets.EC2_KEY_DEV }}
        script: |
          pkill -f 'java -jar' || true
          nohup java -jar /home/ec2-user/app/*.jar > /home/ec2-user/app/app.log 2>&1 &
