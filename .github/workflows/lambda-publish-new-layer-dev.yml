name: DEV-AWS Lambda Publish New Layer

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: DEV-AWS Lambda Publish New Layer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clean layer directory
        run: rm -rf ./nodejs layer.zip

      - name: Create layer directory
        run: mkdir -p nodejs

      - name: Install dependencies for layer
        run: |
          cp slackbot/package.json slackbot/package-lock.json nodejs/
          cd nodejs
          npm ci --omit=dev

      - name: Zip layer
        run: zip -r layer.zip nodejs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_LAMBDA_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Publish Lambda Layer and update function
        run: |
          LAYER_ARN=$(aws lambda publish-layer-version \
            --layer-name timesmanager-slackbot-node-modules-dev \
            --zip-file fileb://layer.zip \
            --compatible-runtimes nodejs24.x \
            --query 'LayerVersionArn' \
            --output text)

          echo "Published layer: $LAYER_ARN"

          aws lambda update-function-configuration \
            --function-name ${{ secrets.DEV_LAMBDA_FUNCTION_NAME }} \
            --layers "$LAYER_ARN"