name: Test SSH from GitHub Actions

on:
  workflow_dispatch:  # 手動実行用トリガー

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Public IP Install
        id: ip
        uses: haythem/public-ip@v1.3

      - name: AWS CLI install
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update
          aws --version
      
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: gradle clean build -x test
        working-directory: ./springboot/timesmanager-backend

      # AWS CLIにキーを設定をする
      - name: AWS set Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1
          
      - name: Copy jar file to EC2
        uses: appleboy/scp-action@latest
        with:
            host: ${{ secrets.EC2_HOST_PROD }}
            username: ${{ secrets.EC2_USER_PROD }}
            key: ${{ secrets.EC2_KEY_PROD }}
            source: springboot/timesmanager-backend/build/libs/*.jar
            target: /home/${{ secrets.EC2_USER_PROD }}/app/
            overwrite: true
            strip_components: 4 

      - name: Test SSH from GitHub Actions
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: ${{ secrets.EC2_USER_PROD }}
          key: ${{ secrets.EC2_KEY_PROD }}
          script_stop: true
          debug: true
          script: |
            whoami
            hostname
